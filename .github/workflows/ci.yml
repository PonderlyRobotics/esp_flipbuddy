# Host-side CI only (no ESP32 hardware).
name: ci

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Host FSM tests
        run: python3 test_fsm.py

      - name: Release safety check (full tree)
        run: python3 scripts/release_check.py --full
